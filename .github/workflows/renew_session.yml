name: Renew note.com Session（毎週日曜 5:00 JST）

on:
  schedule:
    # 毎週日曜 5:00 JST = 前日20:00 UTC。月1回だとセッション切れの空白が
    # 最大1ヶ月生まれ、その間の投稿が全停止するため毎週更新する。
    - cron: '0 20 * * 6'
  workflow_dispatch:  # 手動実行も可能

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright and browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Create output directory
        run: mkdir -p output

      - name: Renew note.com session
        env:
          NOTE_EMAIL:    ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          GITHUB_PAT:    ${{ secrets.GH_PAT }}
          GITHUB_REPO:   ${{ github.repository }}
        run: python scripts/renew_note_session.py
