name: note セッション維持（毎週日曜 5:00 JST）

# note のセッションは約3か月有効で、アクセスのたびに期限が延びる。
# 毎週アクセスして、延長されたセッションを暗号化してコミットする。
# ログイン画面に reCAPTCHA があるため、パスワードでの自動ログインは行わない。
# 失敗した場合（セッション切れ）は GitHub から通知が届くので、
# ローカルで python scripts/setup_note_session.py を実行して新しいセッションを push する。

on:
  schedule:
    - cron: '0 20 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Refresh note.com session
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          NOTE_SESSION_B64: ${{ secrets.NOTE_SESSION_B64 }}
        run: python scripts/refresh_note_session.py

      - name: Commit refreshed session
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/session
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "session: refresh $(date +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
