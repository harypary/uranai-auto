name: Monitor & Auto-Retry Daily Note

on:
  schedule:
    # 毎日 8:00 JST = 23:00 UTC（daily_note の1時間後にチェック）
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  check-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write

    steps:
      - name: Check latest daily_note run result
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 今日の日付（UTC基準）
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking runs for: $TODAY"

          # daily_note の最新実行を取得
          RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/daily_note.yml/runs \
            --jq '.workflow_runs[:5] | .[] | {id:.id, status:.status, conclusion:.conclusion, created_at:.created_at}')
          echo "Recent runs:"
          echo "$RUNS"

          # 今日成功した実行があるか確認
          SUCCESS=$(gh api repos/${{ github.repository }}/actions/workflows/daily_note.yml/runs \
            --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\")) | select(.conclusion == \"success\")] | length")

          echo "success_count=$SUCCESS" >> $GITHUB_OUTPUT

          if [ "$SUCCESS" -gt "0" ]; then
            echo "✅ 今日の投稿は正常に完了しています（$SUCCESS 件）"
          else
            echo "⚠️ 今日の投稿が未完了または失敗しています。再実行します。"
          fi

      - name: Retry daily_note if failed
        if: steps.check.outputs.success_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "日次投稿ワークフローを再実行します..."
          gh workflow run daily_note.yml --repo ${{ github.repository }} --ref master
          echo "再実行トリガー完了"

      # 再実行しても直らない障害（セッション切れ・note.com仕様変更など）は
      # 放置すると数週間気づけないため、Issueを立てて所有者にメール通知する。
      - name: Alert if posting has been failing for days
        if: steps.check.outputs.success_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SINCE=$(date -u -d '3 days ago' +%Y-%m-%d)
          RECENT_SUCCESS=$(gh api repos/${{ github.repository }}/actions/workflows/daily_note.yml/runs \
            --jq "[.workflow_runs[] | select(.created_at >= \"$SINCE\") | select(.conclusion == \"success\")] | length" 2>/dev/null || echo "0")
          echo "直近3日の成功数: $RECENT_SUCCESS"

          if [ "$RECENT_SUCCESS" -gt 0 ]; then
            echo "直近に成功があるため通知しません。"
            exit 0
          fi

          # 既存の未解決アラートがあれば重複して立てない
          EXISTING=$(gh issue list --repo ${{ github.repository }} \
            --label "posting-down" --state open --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "既存のアラートIssueがあるためスキップします。"
            exit 0
          fi

          gh label create "posting-down" --repo ${{ github.repository }} \
            --color "B60205" --description "自動投稿の停止アラート" 2>/dev/null || true

          LATEST=$(gh api repos/${{ github.repository }}/actions/workflows/daily_note.yml/runs \
            --jq '.workflow_runs[0].html_url' 2>/dev/null || echo "")

          gh issue create --repo ${{ github.repository }} \
            --label "posting-down" \
            --title "自動投稿が3日以上停止しています" \
            --body "日次投稿が直近3日間、一度も成功していません。

          最新の実行ログ: $LATEST

          よくある原因:
          - note.com のセッション切れ（renew_session ワークフローを手動実行して復旧）
          - note.com のログイン画面や編集画面のDOM変更（ログの「診断」行を確認）
          - Gemini の無料枠切れ（RESOURCE_EXHAUSTED）

          復旧したらこのIssueをクローズしてください。次の障害時に再度通知されます。"
          echo "アラートIssueを作成しました。"
